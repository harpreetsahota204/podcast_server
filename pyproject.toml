[project]
name = "podcast-server"
version = "0.1.0"
description = "Self-hosted, agent-operated podcast publishing engine (MCP tools, Cloudflare R2, RSS)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=0.4.0",
    "boto3>=1.34.0",
    "mutagen>=1.47.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "markdown-it-py>=3.0.0",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.20.0",
    "huggingface_hub>=0.30.0",
    "pillow>=13.0.0",
    "pyyaml>=6.0",
    "python-substack>=0.10,<0.11",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Installed editable by `uv sync`, so `core`, `exporters`, `importers`, `mcp_server`, and `metrics`
# import from anywhere (scripts, tests, agents) without setting PYTHONPATH.
[tool.hatch.build.targets.wheel]
packages = ["core", "exporters", "importers", "mcp_server", "metrics"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["F", "E9", "B", "S", "UP", "SIM"]
# S101: asserts in tests; S603/S607: git subprocess calls with fixed args; S608: column names are code-defined.
ignore = ["S101", "S603", "S607", "S608"]
