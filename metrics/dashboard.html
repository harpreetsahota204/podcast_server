<!doctype html>
<!--
  Podcast metrics dashboard template, filled by metrics/report.py.
  Self-contained on purpose: no external scripts, fonts, or requests, so it opens offline.
  The typeface (Martian Mono, OFL) is embedded as base64 and Chart.js 4.5.1 (MIT) is inlined.
  All data is inserted with textContent / attributes, never innerHTML; charts draw on canvas.

  Layout follows the standard dashboard pattern: filters in the header, a row of KPI cards,
  a chart row (primary timeline, secondary comparison), then sortable detail tables.
  Tabs: Overview, then one tab per platform. Each tab's dot is that platform's colour, or
  red when its last collection failed. Tabs are URL hashes (#youtube), so back/forward work.

  Filters: the range buttons (7D / 30D / 90D) and a measured stretch (drag across the
  timeline) apply to every KPI, both charts, the sparklines, and the episode tables' range
  columns, on every tab. The chart row is one element moved into whichever tab is open, so
  the chosen metric and stretch carry across tabs.

  Design: terminal dense. Near-black, hairlines instead of boxes, square corners, small type in
  the condensed cut of one monospace family. Chart animations are off (many charts, instant updates).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Listening report</title>
<style>
  @font-face {
    font-family: "Martian Mono";
    src: url(data:font/woff2;base64,__FONT_WOFF2_BASE64__) format("woff2");
    font-weight: 100 800;
    font-stretch: 75% 112.5%;
    font-display: block;
  }
  :root {
    --bg: #07090a;        /* near-black with a cool cast: a terminal at night */
    --bar-bg: rgba(7, 9, 10, 0.88);
    --panel: #07090a;     /* panels sit flush with the page; hairlines do the separating */
    --panel-2: #0e1213;   /* hover and selected */
    --rule: #181e21;      /* hairlines */
    --rule-2: #232b2f;
    --ink: #d6e0e5;       /* text */
    --muted: #7b8990;     /* secondary text */
    --faint: #4b575d;     /* tertiary text, empty values */
    --amber: #ffb454;     /* releases and the measured stretch, like a VU needle */
    --up: #6fd0ae;
    --down: #f07c64;
    --radius: 2px;        /* square-ish corners everywhere */
    --mono: "Martian Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --bar-h: 40px;        /* sticky bar height, for anchor offsets */
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  /* Dense by design: small type in the condensed cut, so a full report fits on few screens. */
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 12px/1.55 var(--mono); font-stretch: 75%;
         -webkit-font-smoothing: antialiased; }
  main { max-width: 1320px; margin: 0 auto; padding: 0 24px 80px; }
  a { color: var(--ink); text-decoration-color: var(--rule-2); text-underline-offset: 3px; }
  a:hover { text-decoration-color: var(--ink); }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  button, input, select { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--src); flex: none; }
  /* Labels: small uppercase, lightly tracked. The wide cut is saved for section titles and platform names. */
  .label { font-size: 10.5px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .faint { color: var(--faint); }
  .nowrap { white-space: nowrap; }
  .empty { color: var(--muted); padding: 14px 12px; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

  /* ---------- header: tabs, then the filters that apply to every tab ---------- */
  .topbar { position: sticky; top: 0; z-index: 10; height: var(--bar-h); background: var(--bar-bg);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--rule); }
  .topbar-inner { max-width: 1320px; height: 100%; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; gap: 14px; }
  .brand { display: flex; align-items: center; gap: 8px; white-space: nowrap; color: var(--ink); }
  .brand::before { content: ""; width: 9px; height: 9px; background: var(--amber); border-radius: 2px; }
  .tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; align-self: stretch; }
  .tabs a { position: relative; display: inline-flex; align-items: center; gap: 7px; padding: 0 10px; text-decoration: none;
            color: var(--muted); white-space: nowrap; }
  .tabs a:hover { color: var(--ink); background: var(--panel-2); }
  .tabs a[aria-selected="true"] { color: var(--ink); }
  .tabs a[aria-selected="true"]::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px;
                                         background: var(--src, var(--amber)); }
  .tabs a .dot.failing { --src: var(--down); box-shadow: 0 0 0 3px rgba(240, 124, 100, 0.18); }
  .filters { display: flex; align-items: center; gap: 8px; flex: none; }
  .seg { display: inline-flex; border: 1px solid var(--rule); border-radius: var(--radius); padding: 2px; background: var(--panel); flex: none; }
  .seg button { border: 0; background: transparent; padding: 3px 9px; border-radius: 1px; cursor: pointer; color: var(--muted);
                font-weight: 500; font-stretch: 100%; }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .stretch-chip { display: inline-flex; align-items: center; gap: 7px; padding: 3px 9px; border: 1px solid rgba(255, 180, 84, 0.45);
                  border-radius: var(--radius); background: rgba(255, 180, 84, 0.08); color: var(--amber); cursor: pointer; white-space: nowrap; }
  .stretch-chip:hover { background: rgba(255, 180, 84, 0.16); }
  .health { display: inline-flex; align-items: center; gap: 7px; flex: none; padding: 3px 9px; border: 1px solid var(--rule);
            border-radius: var(--radius); text-decoration: none; color: var(--muted); }
  .health .dot { --src: var(--up); box-shadow: 0 0 0 3px rgba(111, 208, 174, 0.15); }
  .health.bad { color: var(--down); border-color: rgba(240, 124, 100, 0.4); }
  .health.bad .dot { --src: var(--down); box-shadow: 0 0 0 3px rgba(240, 124, 100, 0.15); }

  /* ---------- masthead and platform header ---------- */
  .masthead { padding: 16px 0 0; }
  .masthead h1 { margin: 0; font-size: 17px; font-weight: 500; font-stretch: 100%; line-height: 1.3; }
  .masthead .meta { margin-top: 2px; color: var(--muted); font-size: 11px; }
  .phead { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 20px; align-items: end; padding: 16px 0 0; }
  .phead h1 { display: flex; align-items: center; gap: 10px; margin: 0; font-size: 17px; font-weight: 600; font-stretch: 112.5%;
              letter-spacing: 0.1em; text-transform: uppercase; }
  .phead h1 .dot { width: 9px; height: 9px; }
  .phead .p-about { color: var(--muted); font-size: 11.5px; }
  .phead .p-run { grid-column: 2; grid-row: 1 / span 2; text-align: right; color: var(--faint); font-size: 11px; }
  .phead .p-run .status { display: inline-block; margin-bottom: 4px; }
  .phead .p-msg { grid-column: 1 / -1; color: var(--faint); font-size: 11px; }

  /* ---------- sections ---------- */
  section { scroll-margin-top: calc(var(--bar-h) + 10px); }
  .section-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px;
                  margin: 26px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--rule); }
  .section-head h2 { margin: 0; font-size: 11px; font-weight: 600; font-stretch: 112.5%; letter-spacing: 0.14em; text-transform: uppercase; }
  .section-head .note { color: var(--faint); }
  /* Anything reporting the measured stretch instead of the range is amber, like the stretch itself. */
  .note.stretch, .k-meta.stretch, .compare-note.stretch { color: var(--amber); }
  .panel { background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius); }

  /* ---------- KPI cards (platform tab: every number; overview: inside each platform card) ---------- */
  /* Grids of cards draw their hairlines per cell (right and bottom), so a short last row leaves page background. */
  .kpi-row, .platforms { display: grid; margin-top: 12px; border-top: 1px solid var(--rule); border-left: 1px solid var(--rule); }
  .kpi-row { grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); }
  .kpi-row > *, .platforms > * { border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .kpi { position: relative; display: block; min-width: 0; padding: 8px 12px; text-align: left; background: var(--panel); border: 0; }
  button.kpi { cursor: pointer; }
  button.kpi:hover { background: var(--panel-2); }
  .kpi[aria-pressed="true"] { background: var(--panel-2); }
  .kpi[aria-pressed="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--src); }
  .k-label { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase;
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .k-value { display: block; margin-top: 2px; font-size: 16px; font-weight: 500; font-stretch: 100%; letter-spacing: -0.01em; line-height: 1.25; }
  .k-meta { display: block; color: var(--faint); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .delta { font-weight: 600; font-stretch: 100%; }
  .delta.up { color: var(--up); }
  .delta.down { color: var(--down); }

  /* ---------- platform cards: the overview's KPI row ---------- */
  .platforms { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .pcard { position: relative; display: flex; flex-direction: column; gap: 6px; min-width: 0; padding: 10px 0 8px; background: var(--panel); }
  .pcard::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--src); opacity: 0.8; }
  .pcard.failing::before { background: var(--down); }
  .p-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 12px; }
  .p-name { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 600; font-stretch: 112.5%;
            letter-spacing: 0.12em; text-transform: uppercase; }
  .p-go { color: var(--muted); text-decoration: none; white-space: nowrap; }
  .p-go:hover { color: var(--ink); }
  .p-desc { margin: 0; padding: 0 12px; color: var(--faint); font-size: 11px; display: -webkit-box; -webkit-line-clamp: 2;
            -webkit-box-orient: vertical; overflow: hidden; min-height: 2.9em; }
  /* The lead number gets its own row; the next two share one, so their labels have room. */
  .p-nums { display: grid; grid-template-columns: 1fr 1fr; }
  .p-nums .kpi { padding: 5px 12px; border: 0; }
  .p-nums .kpi:first-child { grid-column: 1 / -1; }
  .p-nums .kpi:first-child .k-value { font-size: 20px; }
  .p-nums .kpi .k-value { font-size: 13.5px; }
  .p-nums .empty { grid-column: 1 / -1; padding: 6px 12px; }
  .spark { position: relative; height: 38px; margin: 0 12px; }
  .p-foot { display: flex; justify-content: space-between; gap: 8px; padding: 0 12px; color: var(--faint); font-size: 10.5px; }
  .p-foot .bad { color: var(--down); }

  /* ---------- chart row: primary timeline and secondary comparison ---------- */
  .chart-row { display: grid; grid-template-columns: minmax(0, 2fr) minmax(300px, 1fr); gap: 12px; margin-top: 12px; }
  .chart-panel { display: flex; flex-direction: column; min-width: 0; padding: 10px 14px 12px; }
  .panel-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 14px; margin-bottom: 6px; }
  .controls { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .seg.small button { padding: 3px 9px; font-size: 11.5px; font-weight: 400; }
  .select { position: relative; display: inline-flex; align-items: center; min-width: 0; max-width: 100%; }
  .select select { appearance: none; -webkit-appearance: none; max-width: 100%; text-overflow: ellipsis; cursor: pointer;
                   background: var(--panel); border: 1px solid var(--rule-2); border-radius: var(--radius); padding: 3px 28px 3px 9px;
                   color: var(--ink); font-size: 11.5px; }
  .select select:hover { border-color: var(--muted); }
  .select::after { content: ""; position: absolute; right: 12px; top: 50%; width: 5px; height: 5px; margin-top: -4px;
                   border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(45deg); pointer-events: none; }
  .select optgroup, .select option { background: var(--bg); color: var(--ink); }
  .readout { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; min-height: 2.4em; }
  .readout .r-main { font-size: 14px; font-weight: 500; font-stretch: 100%; }
  .readout .r-sub { color: var(--muted); }
  .readout .r-cue { color: var(--amber); }
  .chart-box { position: relative; height: 240px; }
  .chart-box.tall { height: 260px; touch-action: pan-y; cursor: crosshair; user-select: none; }
  .chart-box.tall:focus-visible { outline-offset: 4px; }
  .track-key { color: var(--faint); font-size: 11px; white-space: nowrap; }
  .track-key::before { content: ""; display: inline-block; width: 14px; height: 0; margin-right: 6px; vertical-align: middle;
                       border-top: 1.5px solid var(--ink); opacity: 0.7; }
  .daylog { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--rule);
            min-height: 40px; color: var(--faint); font-size: 11px; }
  .chip { display: inline-flex; align-items: center; gap: 7px; max-width: 100%; padding: 2px 8px; border: 1px solid var(--rule);
          border-radius: var(--radius); background: var(--bg); cursor: pointer; color: var(--muted); font-size: 11px; }
  .chip:hover { color: var(--ink); border-color: var(--rule-2); }
  .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip .k { width: 7px; height: 7px; border-radius: 2px; background: var(--amber); flex: none; }
  .chip.thumbnail .k { background: var(--ink); }
  /* Derived numbers for the charted series, in a strip under the chart. */
  .facts-strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 0 18px; margin: 8px 0 0; padding-top: 6px;
                 border-top: 1px solid var(--rule); }
  .facts-strip div { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; border-bottom: 1px solid var(--rule); }
  .facts-strip dt { color: var(--muted); }
  .facts-strip dd { margin: 0; font-weight: 500; font-stretch: 100%; white-space: nowrap; }
  .facts-note { margin: 6px 0 0; color: var(--faint); font-size: 11px; }
  .open-link { align-self: flex-start; margin-top: 8px; color: var(--muted); text-decoration: none; }
  .open-link:hover { color: var(--ink); }
  .open-link .dot { margin-right: 7px; }
  .compare-note { margin-top: 6px; color: var(--faint); font-size: 11px; }

  /* ---------- back catalog ---------- */
  .kpis { display: flex; flex-wrap: wrap; gap: 8px 28px; padding: 10px 12px; border-bottom: 1px solid var(--rule); }
  .kpis .v { display: block; font-size: 15px; font-weight: 500; font-stretch: 100%; }
  .kpis .l { color: var(--muted); font-size: 11px; }
  .plots { display: grid; grid-template-columns: 1fr 1fr; }
  .plot { min-width: 0; padding: 8px 12px 10px; }
  .plot.wide { grid-column: 1 / -1; border-bottom: 1px solid var(--rule); }
  .plot.half + .plot.half { border-left: 1px solid var(--rule); }
  .plot-title { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; margin-bottom: 6px; }
  .plot-title .faint { font-size: 11px; }
  .plot .chart-box { height: 220px; }
  .plot.half .chart-box { height: 170px; }

  /* ---------- tables ---------- */
  .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-bottom: 10px; }
  .search { flex: 1 1 260px; max-width: 420px; display: flex; align-items: center; gap: 9px; background: var(--panel);
            border: 1px solid var(--rule); border-radius: var(--radius); padding: 0 9px; }
  .search:focus-within { border-color: var(--muted); }
  .search input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 8px 0; }
  .search input::placeholder { color: var(--faint); }
  .search input:focus { outline: none; }
  .search svg { width: 13px; height: 13px; stroke: var(--faint); fill: none; stroke-width: 2; flex: none; }
  .toggle { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); cursor: pointer; }
  .toggle input { accent-color: var(--up); }
  .count { margin-left: auto; color: var(--faint); }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 5px 10px; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: middle; }
  thead th { border-bottom-color: var(--rule-2); }
  tbody tr:last-child > td { border-bottom: 0; }
  tbody tr:hover > td { background: rgba(227, 235, 231, 0.025); }
  td.n, th.n { text-align: right; white-space: nowrap; }
  td.n { position: relative; font-size: 13.5px; font-stretch: 100%; }
  td.n .cell-bar { position: absolute; right: 14px; bottom: 5px; height: 2px; max-width: calc(100% - 28px); background: var(--src); opacity: 0.7; border-radius: 1px; }
  td.n .cell-val { position: relative; }
  td.empty-val { color: var(--faint); }
  th button { all: unset; cursor: pointer; display: inline-flex; flex-direction: column; gap: 3px; }
  th.n button { align-items: flex-end; }
  th button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  .th-sub { display: inline-flex; align-items: center; gap: 5px; color: var(--faint); font-size: 10.5px; text-transform: none; letter-spacing: 0; }
  .th-sub.stretch { color: var(--amber); }
  th[aria-sort] .label { color: var(--ink); }
  th[aria-sort="descending"] .label::after { content: " ↓"; }
  th[aria-sort="ascending"] .label::after { content: " ↑"; }
  .ep { display: flex; align-items: flex-start; gap: 10px; min-width: 260px; max-width: 540px; }
  .disclose { flex: none; width: 20px; height: 20px; margin-top: 1px; padding: 0; border: 1px solid var(--rule-2); border-radius: var(--radius);
              background: transparent; cursor: pointer; color: var(--muted); line-height: 1; }
  .disclose:hover { color: var(--ink); border-color: var(--muted); }
  .disclose[aria-expanded="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .ep-text { min-width: 0; }
  .ep-guest { font-weight: 500; font-stretch: 100%; }
  .ep-topic { color: var(--faint); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-label { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-width: 240px; max-width: 540px; }
  tr.detail > td, tr.detail:hover > td { background: var(--panel-2); padding: 10px 12px 12px; }
  /* Expanded episode: every number it has, from every platform, then links. */
  .facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 0 32px; margin: 0; max-width: 1100px; }
  .fact { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--rule); }
  .fact dt { display: flex; align-items: center; gap: 8px; color: var(--muted); min-width: 0; }
  .fact dd { margin: 0; font-size: 13.5px; font-weight: 500; font-stretch: 100%; text-align: right; }
  .detail-links { margin: 12px 0 0; padding: 0; list-style: none; }
  .detail-links li { margin-top: 4px; color: var(--faint); }
  .detail-links a { color: var(--ink); }
  .pager { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; color: var(--faint); }
  .pager button { padding: 3px 10px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--panel); cursor: pointer; color: var(--muted); }
  .pager button:hover:not(:disabled) { color: var(--ink); border-color: var(--rule-2); }
  .pager button:disabled { opacity: 0.4; cursor: default; }

  /* ---------- sources ---------- */
  .sources { list-style: none; margin: 0; padding: 0; }
  .sources li { display: grid; grid-template-columns: 140px 84px minmax(120px, 1fr) minmax(220px, 1.5fr); gap: 6px 18px;
                align-items: center; padding: 6px 12px; border-bottom: 1px solid var(--rule); }
  .sources li:last-child { border-bottom: 0; }
  .src-name { display: flex; align-items: center; gap: 9px; font-weight: 500; font-stretch: 100%; }
  .status { justify-self: start; padding: 2px 6px; border-radius: var(--radius); font-size: 10px; font-weight: 600; font-stretch: 112.5%;
            letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--rule-2); }
  .status.ok { color: var(--up); border-color: rgba(111, 208, 174, 0.35); }
  .status.failed { color: var(--down); border-color: rgba(240, 124, 100, 0.4); }
  .span-track { position: relative; height: 6px; background: var(--rule); border-radius: 3px; }
  .span-fill { position: absolute; top: 0; bottom: 0; min-width: 4px; background: var(--src); border-radius: 3px; }
  .src-detail .faint { font-size: 11px; }

  @media (max-width: 900px) {
    .chart-row { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 760px) {
    main, .topbar-inner { padding-left: 14px; padding-right: 14px; }
    .topbar-inner { gap: 10px; }
    .brand span, .health span:last-child, .stretch-chip span { display: none; }
    .tabs a { padding: 0 7px; }
    .phead { grid-template-columns: 1fr; }
    .phead .p-run { grid-column: auto; grid-row: auto; text-align: left; }
    .plots { grid-template-columns: 1fr; }
    .plot.half + .plot.half { border-left: 0; border-top: 1px solid var(--rule); }
    .chart-box.tall { height: 200px; }
    .sources li { grid-template-columns: 1fr auto; }
    .sources li .span-track, .sources li .src-detail { grid-column: 1 / -1; }
    .count { margin-left: 0; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .kpi, .seg button, .tabs a, .chip, .pager button { transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease; }
  }
  /* Print: the open tab on white, without the controls that only work on screen. */
  @media print {
    body { background: #fff; color: #111; }
    .topbar { position: static; background: #fff; border-bottom-color: #ccc; backdrop-filter: none; }
    .seg, .health, .stretch-chip, .tools, .pager, .controls, .select, .daylog, .disclose { display: none !important; }
    .tabs a:not([aria-selected="true"]) { display: none; }
    .panel, .pcard, .kpi, .kpi-row, .platforms { background: #fff; border-color: #ccc; break-inside: avoid; }
    .chart-row { grid-template-columns: 1fr; }
    a, .ep-guest, .k-value, .readout .r-main { color: #111; }
  }
</style>
</head>
<body>

      </div>

      <div class="compare-note" id="compare-note"></div>
