<script>/*__CHARTJS__*/</script>
<script id="dashboard-data" type="application/json">__DASHBOARD_DATA__</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("dashboard-data").textContent);
const SVG_NS = "http://www.w3.org/2000/svg";
const PAGE_SIZE = 25;
const TOP_ROWS = 10;

/* ---------- small helpers ---------- */

// A value that was collected (zero counts; missing doesn't).
const has = (v) => v !== null && v !== undefined;

// Create an element with attributes and text; text always goes through textContent.
function el(tag, attrs = {}, text) {
  const node = tag.startsWith("svg:") ? document.createElementNS(SVG_NS, tag.slice(4)) : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) if (has(v) && v !== false) node.setAttribute(k, v);
  if (text !== undefined) node.textContent = text;
  return node;
}

// Only allow http(s) links from data, so a crafted URL can't run script.
function safeHref(url) {
  return /^https?:\/\//i.test(url || "") ? url : null;
}

// Human-sized numbers: 1,234 / 12.3k / 4.5M; bytes get binary units.
function fmt(value, metric) {
  if (!has(value)) return "–";
  if (metric === "bytes") {
    const units = ["B", "KB", "MB", "GB", "TB"];
    let v = value, i = 0;
    while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
    return `${v.toFixed(v < 10 && i ? 1 : 0)} ${units[i]}`;
  }
  const abs = Math.abs(value);
  if (abs >= 1e6) return `${(value / 1e6).toFixed(1)}M`;
  if (abs >= 1e4) return `${(value / 1e3).toFixed(1)}k`;
  if (!Number.isInteger(value)) return value.toFixed(abs < 1 ? 2 : abs < 10 ? 1 : 0);
  return value.toLocaleString("en-US");
}

// A change rather than a level: "+12", "−3", "±0".
function fmtSigned(value, metric) {
  if (!has(value)) return "–";
  return `${value > 0 ? "+" : value < 0 ? "−" : "±"}${fmt(Math.abs(value), metric)}`;
}

function shortDate(iso) {
  return new Date(`${iso}T00:00:00Z`).toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
}

function dayName(iso) {
  return new Date(`${iso}T00:00:00Z`).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", timeZone: "UTC" });
}

const sum = (values) => values.reduce((s, v) => s + (v || 0), 0);
// The numbers of a [[date, value], ...] series.
const valuesOf = (series) => series.map(([, v]) => v);
// A run timestamp as "2026-10-29 06:17".
const runTime = (iso) => iso.replace("T", " ").slice(0, 16);
const median = (values) => {
  const s = [...values].sort((a, b) => a - b), mid = Math.floor(s.length / 2);
  return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
};

// Running total from the first collected day (earlier days stay empty).
function runningTotal(values, from) {
  let total = 0;
  return values.map((v, i) => (i < from ? null : (total += v)));
}

// Trailing 7-day mean once seven collected days exist; null before that.
function trailingAverage(values, from, window = 7) {
  return values.map((_, i) => (i - from + 1 >= window ? sum(values.slice(i - window + 1, i + 1)) / window : null));
}

// Episode titles read "Guest — Topic"; split them so the guest can lead.
function splitTitle(title) {
  const [guest, ...rest] = (title || "").split(" — ");
  return { guest, topic: rest.join(" — ") };
}

// A CSS custom property's value, so chart colours come from the same tokens as the page.
const cssVar = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
// "#rrggbb" with an alpha, for chart fills.
function alpha(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
}

/* ---------- colour and name per source ---------- */

// Built-in collectors get fixed colours; plugged-in sources get a stable one from the fallback set.
const SOURCE_COLORS = {
  op3: "#5cc3cc", cloudflare: "#a896f2", youtube: "#f28b77", x: "#a8b8d8",
  instagram: "#ef8fbf", devto: "#c3d36f", substack: "#d7c4a3",
};
const FALLBACK_COLORS = ["#9ad4ff", "#f5d76e", "#b5e48c"];
function sourceColor(source) {
  if (SOURCE_COLORS[source]) return SOURCE_COLORS[source];
  const hash = [...(source || "")].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
  return FALLBACK_COLORS[hash % FALLBACK_COLORS.length];
}
// Display names for built-in sources; a plugged-in source shows its collector name, capitalized.
const SOURCE_NAMES = {
  op3: "OP3", cloudflare: "Cloudflare", youtube: "YouTube", x: "X", instagram: "Instagram", devto: "dev.to", substack: "Substack",
};
const sourceName = (source) => SOURCE_NAMES[source] || source.charAt(0).toUpperCase() + source.slice(1);
// A metric label without its platform's name, for places that already say which platform ("YouTube views" → "Views").
function shortLabel(label, source) {
  const name = sourceName(source).toLowerCase(), lower = label.toLowerCase();
  if (!lower.startsWith(`${name} `)) return label;
  const rest = label.slice(name.length + 1);
  return rest.charAt(0).toUpperCase() + rest.slice(1);
}
// Sets --src on a node so CSS can colour it (and its children) by source.
function tint(node, source) {
  node.style.setProperty("--src", sourceColor(source));
  return node;
}
function sourceDot(source) {
  return tint(el("span", { class: "dot", "aria-hidden": "true" }), source);
}

/* ---------- shared state ---------- */

// Every series the timeline can show, keyed like the numbers that describe them ("youtube.views.show"):
// daily totals (kind "day") and running totals such as followers or lifetime views (kind "snapshot").
const CHARTS = new Map([...DATA.charts, ...DATA.trends].map((c) => [c.key, c]));
const DATES = DATA.dates;
const RUNS = Object.fromEntries(DATA.coverage.map((s) => [s.source, s]));
const PLATFORM_NAMES = new Set(DATA.platforms.map((p) => p.source));
// First day each source holds data: earlier days are "not collected", which is different from zero.
const FIRST_DAY = Object.fromEntries(DATA.coverage.filter((s) => s.first_period).map((s) => [s.source, s.first_period]));
// Each series' first day with data: a running total's first reading, or the day its source started collecting.
for (const c of CHARTS.values()) {
  c.first = c.kind === "snapshot" ? (c.series.find(([, v]) => v !== null) || [null])[0] : FIRST_DAY[c.source] || null;
}
const EVENTS_BY_DATE = DATA.events.reduce((m, e) => m.set(e.date, [...(m.get(e.date) || []), e]), new Map());
// Events that can explain a series: releases for every platform, thumbnail changes only for YouTube's.
const eventsOn = (date, chart) => (EVENTS_BY_DATE.get(date) || []).filter((e) => e.kind === "release" || chart.source === "youtube");
const EPISODE_TITLES = new Map(DATA.episodes.rows.map((r) => [r.slug, r.title]));
const RANGES = [...new Set([7, 30, 90, DATA.days])].filter((d) => d <= DATA.days && d <= DATES.length).sort((a, b) => a - b);

// The series a tab opens on: headline before the rest, daily before running totals, then the longest history.
const collectedDays = (c) => c.series.filter(([d, v]) => v !== null && (!c.first || d >= c.first)).length;
function defaultKey(tab) {
  const rank = (c) => (c.headline ? 0 : 2) + (c.kind === "day" ? 0 : 1);
  const pool = [...CHARTS.values()].filter((c) => tab === "overview" || c.source === tab);
  pool.sort((a, b) => rank(a) - rank(b) || collectedDays(b) - collectedDays(a));
  return pool.length ? pool[0].key : null;
}
const state = {
  tab: "overview",   // "overview" or a platform's source name
  range: RANGES.length ? RANGES[RANGES.length - 1] : DATES.length,
  key: defaultKey("overview"),
  hover: null,       // index into the visible days under the pointer (or keyboard), or null
  selection: null,   // [start, end] indices into the visible days, or null; a filter for every tab
  mode: "daily",     // "daily" bars with a 7-day average, or "cumulative" running total
  compare: {},       // tab → chosen comparison id
};

const visibleDates = () => DATES.slice(-state.range);
const visibleSeries = (chart) => chart.series.slice(-state.range);
const stretchLabel = ([a, b]) => `${shortDate(visibleDates()[a])} – ${shortDate(visibleDates()[b])}`;
// What the filters currently cover, in words.
const spanLabel = () => (state.selection ? stretchLabel(state.selection) : `last ${state.range} days`);
// Indices into the full window (DATA.dates) that the filters cover: the range, or the measured stretch inside it.
function activeSpan() {
  const at = DATES.length - state.range;
  return state.selection ? [at + state.selection[0], at + state.selection[1]] : [at, DATES.length - 1];
}
// Total of a window-aligned daily array over the filtered days.
function spanSum(values) {
  const [a, b] = activeSpan();
  let total = 0;
  for (let i = a; i <= b; i++) total += values[i] || 0;
  return total;
}

// Index of the first visible day the series has data for (0 when it covers the whole range).
function collectedFrom(chart, dates) {
  if (!chart.first || chart.first <= dates[0]) return 0;
  const i = dates.findIndex((d) => d >= chart.first);
  return i === -1 ? dates.length : i;
}

/* ---------- Chart.js: theme and the overlay plugin ---------- */

const COLORS = { ink: cssVar("--ink"), muted: cssVar("--muted"), faint: cssVar("--faint"), rule: cssVar("--rule"),
                 rule2: cssVar("--rule-2"), amber: cssVar("--amber"), bg: cssVar("--bg") };
Chart.defaults.font.family = '"Martian Mono", ui-monospace, Menlo, monospace';
Chart.defaults.font.size = 10;
Chart.defaults.color = COLORS.faint;
Chart.defaults.borderColor = COLORS.rule;
Chart.defaults.animation = false;
Chart.defaults.maintainAspectRatio = false;
Chart.defaults.plugins.legend.display = false;
Object.assign(Chart.defaults.plugins.tooltip, {
  backgroundColor: "#0a0f0e", borderColor: COLORS.rule2, borderWidth: 1, cornerRadius: 2, padding: 8,
  titleColor: COLORS.ink, bodyColor: COLORS.muted, footerColor: COLORS.amber, displayColors: false,
  titleFont: { weight: "500" }, footerFont: { weight: "400" },
});

// Draws what Chart.js has no option for, from `chart.$overlay`: the days before a series has data (hatched),
// the measured stretch (amber band), release and thumbnail flags, and text labels next to chosen points.
const overlayPlugin = {
  id: "overlay",
  beforeDatasetsDraw(chart) {
    const o = chart.$overlay, x = chart.scales.x;
    if (!o || !x || x.type !== "category") return;
    const { ctx, chartArea: a } = chart, half = (x.getPixelForValue(1) - x.getPixelForValue(0)) / 2;
    ctx.save();
    if (o.offFrom > 0) {
      const right = x.getPixelForValue(o.offFrom) - half;
      ctx.fillStyle = "rgba(227, 235, 231, 0.035)";
      ctx.fillRect(a.left, a.top, right - a.left, a.height);
      ctx.strokeStyle = COLORS.rule2;
      ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.moveTo(right, a.top); ctx.lineTo(right, a.bottom); ctx.stroke();
      if (o.hatchLabel && right - a.left > 150) {
        ctx.fillStyle = COLORS.faint;
        ctx.fillText(o.hatchLabel, a.left + 8, a.bottom - 8);
      }
    }
    if (o.stretch) {
      const [s, e] = o.stretch, l = x.getPixelForValue(s) - half, r = x.getPixelForValue(e) + half;
      ctx.setLineDash([]);
      ctx.fillStyle = alpha(COLORS.amber, 0.12);
      ctx.fillRect(l, a.top, r - l, a.height);
      ctx.strokeStyle = COLORS.amber;
      ctx.beginPath(); ctx.moveTo(l, a.top); ctx.lineTo(l, a.bottom); ctx.moveTo(r, a.top); ctx.lineTo(r, a.bottom); ctx.stroke();
    }
    ctx.restore();
  },
  afterDatasetsDraw(chart) {
    const o = chart.$overlay;
    if (!o) return;
    const { ctx, chartArea: a, scales: { x } } = chart;
    ctx.save();
    for (const { index, kind, count } of o.events || []) {
      const px = x.getPixelForValue(index), colour = kind === "release" ? COLORS.amber : COLORS.ink;
      ctx.strokeStyle = alpha(colour, 0.4);
      ctx.setLineDash([2, 3]);
      ctx.beginPath(); ctx.moveTo(px, a.top + 12); ctx.lineTo(px, a.bottom); ctx.stroke();
      // The flag hangs right of its line, or left near the chart's right edge so it isn't cut off.
      const left = px + 12 > a.right ? px - 11 : px - 1;
      ctx.fillStyle = colour;
      ctx.fillRect(left, a.top, 12, 11);
      if (count > 1) {
        ctx.fillStyle = COLORS.bg;
        ctx.font = `700 8px ${Chart.defaults.font.family}`;
        ctx.fillText(String(count), left + 3, a.top + 8.5);
      }
    }
    for (const { x: vx, y: vy, text, dx = 8, dy = 3 } of o.labels || []) {
      ctx.fillStyle = COLORS.muted;
      ctx.font = `10px ${Chart.defaults.font.family}`;
      ctx.textAlign = dx < 0 ? "right" : "left";
      ctx.fillText(text, chart.scales.x.getPixelForValue(vx) + dx, chart.scales.y.getPixelForValue(vy) + dy);
    }
    ctx.restore();
  },
};
Chart.register(overlayPlugin);

// Charts are created once and updated in place when filters change (no re-creation, no animation).
function upsertChart(canvas, config) {
  let existing = Chart.getChart(canvas);
  // Chart.js can't switch an existing chart's type, so a new type means a new chart.
  if (existing && existing.config.type !== config.type) {
    existing.destroy();
    existing = null;
  }
  if (!existing) return new Chart(canvas, config);
  existing.data = config.data;
  existing.options = config.options;
  existing.update("none");
  return existing;
}

/* ---------- numbers: KPI cards ---------- */

// What one series reports right now: {value, previous, compare, basis, change, stretch}.
// Daily numbers: the total over the range, compared with the range before it (honest about missing
// history). Running totals: the latest level, compared with the level a range ago. While a stretch is
// measured, both report that stretch instead: a daily total, or how far a level moved.
// How far a running total moved over visible days a..b: from the day before the stretch (or its first
// reading inside it) to the stretch's last day. {base, end, value}; value is null without readings.
function levelChange(chart, [a, b]) {
  const values = valuesOf(chart.series), at = values.length - state.range;
  const end = values[at + b], base = values[at + a - 1] ?? values.slice(at + a, at + b + 1).find((v) => v !== null);
  return { base, end, value: has(end) && has(base) ? end - base : null };
}

function reading(chart, number) {
  const n = state.range, values = valuesOf(chart.series), at = values.length - n, sel = state.selection;
  if (chart.kind === "snapshot") {
    if (sel) {
      const { value } = levelChange(chart, sel);
      return { value, change: true, stretch: true, basis: `${value === null ? "no readings" : "change"} · ${stretchLabel(sel)}` };
    }
    const basis = chart.entity_type === "account" ? "latest" : `latest · ${chart.tracked} ${chart.entity_type}s`;
    return { value: values[values.length - 1], previous: at > 0 ? values[at - 1] : null, compare: `vs ${n}d ago`, basis };
  }
  if (sel) return { value: sum(values.slice(at + sel[0], at + sel[1] + 1)), stretch: true, basis: stretchLabel(sel) };
  const value = sum(values.slice(at)), dates = chart.series.map(([d]) => d), compare = `vs prev ${n}d`;
  const since = { value, previous: null, basis: `since ${shortDate(chart.first)}` };
  if (chart.first && chart.first > dates[at]) return since;
  // The embedded series only covers the report window, so the full window's comparison comes from the collector data.
  if (n === DATA.days) return { value, previous: number ? number.previous : null, compare, basis: `last ${n} days` };
  if (at < n) return { value, previous: null, basis: `last ${n} days` };
  if (chart.first && chart.first > dates[at - n]) return since;
  return { value, previous: sum(values.slice(at - n, at)), compare, basis: `last ${n} days` };
}

// "↑ 12% vs prev 30d" when there's a baseline; otherwise the plain basis, so nothing pretends to compare.
function metaLine(r) {
  const line = el("span", { class: `k-meta${r.stretch ? " stretch" : ""}` });
  if (r.previous && r.value !== null && !r.stretch) {
    const pct = Math.round(((r.value - r.previous) / r.previous) * 100);
    line.append(el("span", { class: `delta ${pct >= 0 ? "up" : "down"}` }, `${pct >= 0 ? "↑" : "↓"} ${Math.abs(pct)}%`), ` ${r.compare}`);
  } else {
    line.textContent = r.basis;
  }
  return line;
}

// One KPI card: label, value, and change. A number with a series is a button that puts it on the timeline.
function kpiCard(number, label = number.label) {
  const chart = CHARTS.get(number.key);
  const title = [number.description, `${sourceName(number.source)} · ${number.basis}`, chart ? "Click to chart it" : ""].filter(Boolean).join("\n");
  const card = tint(el(chart ? "button" : "div", { class: "kpi", title }), number.source);
  const head = el("span", { class: "k-label" });
  head.append(sourceDot(number.source), el("span", {}, label));
  const r = chart ? reading(chart, number) : { value: number.current, previous: number.previous, compare: number.basis, basis: number.basis };
  card.append(head, el("span", { class: "k-value" }, r.change ? fmtSigned(r.value, number.metric) : fmt(r.value, number.metric)), metaLine(r));
  if (chart) {
    card.type = "button";
    card.dataset.key = number.key;
    card.setAttribute("aria-pressed", String(number.key === state.key));
    card.addEventListener("click", () => selectChart(number.key));
  }
  return card;
}

// A platform's numbers: headline first, then daily totals, account counts, and per-item totals.
function platformNumbers(source) {
  const rank = (n) => (n.headline ? 0 : 3) + (n.granularity === "day" ? 0 : n.entity_type === "account" ? 1 : 2);
  return DATA.numbers.filter((n) => n.source === source).sort((a, b) => rank(a) - rank(b));
}

// The platform tab's KPI row: every number the platform collects.
function renderKpis() {
  const box = document.getElementById("kpis");
  box.replaceChildren();
  if (state.tab === "overview") return;
  const numbers = platformNumbers(state.tab);
  if (!numbers.length) box.append(el("p", { class: "empty" }, `Nothing collected from ${sourceName(state.tab)} yet.`));
  for (const n of numbers) box.append(kpiCard(n, shortLabel(n.label, n.source)));
}

/* ---------- overview: one card per platform (the KPI row) ---------- */

// Built once; each refresh replaces the numbers and updates the sparkline in place.
const CARDS = new Map();
function buildPlatformCards() {
  const box = document.getElementById("platforms");
  if (!DATA.platforms.length) {
    box.append(el("p", { class: "empty" }, "No metrics yet. Collect them with: uv run python -m metrics.collect --report"));
    return;
  }
  for (const p of DATA.platforms) {
    const run = RUNS[p.source] || {}, failing = run.last_run_status === "failed";
    const card = tint(el("article", { class: `pcard${failing ? " failing" : ""}`, "aria-label": sourceName(p.source) }), p.source);
    const head = el("div", { class: "p-head" }), name = el("span", { class: "p-name" });
    name.append(sourceDot(p.source), el("span", {}, sourceName(p.source)));
    head.append(name, el("a", { class: "p-go", href: `#${p.source}`, "aria-label": `All ${sourceName(p.source)} numbers` }, "All numbers →"));
    const nums = el("div", { class: "p-nums" });
    const spark = el("div", { class: "spark" }), canvas = el("canvas", { "aria-hidden": "true" });
    spark.append(canvas);
    const foot = el("div", { class: "p-foot" });
    const since = FIRST_DAY[p.source] ? `data since ${shortDate(FIRST_DAY[p.source])}` : "no data yet";
    const ran = run.last_run_at ? `${run.last_run_status || "ran"} · ${runTime(run.last_run_at).slice(5)}` : "never run";
    foot.append(el("span", {}, since), el("span", { class: failing ? "bad" : "" }, ran));
    card.append(head, el("p", { class: "p-desc", title: p.description }, p.description || ""), nums, spark, foot);
    box.append(card);
    CARDS.set(p.source, { nums, canvas });
  }
}

// A card shows the platform's first three numbers (headline first); its sparkline is the platform's opening series.
function renderPlatformCards() {
  for (const [source, { nums, canvas }] of CARDS) {
    nums.replaceChildren();
    const numbers = platformNumbers(source).slice(0, 3);
    if (!numbers.length) nums.append(el("p", { class: "empty" }, "Nothing collected yet."));
    for (const n of numbers) nums.append(kpiCard(n, shortLabel(n.label, source)));
    const chart = CHARTS.get(defaultKey(source));
    if (chart) sparkline(canvas, chart);
  }
}

// A small picture of one series over the range: bars for daily numbers, a line for running totals, the stretch shaded.
function sparkline(canvas, chart) {
  const values = valuesOf(visibleSeries(chart)), colour = sourceColor(chart.source), day = chart.kind === "day";
  const spark = upsertChart(canvas, {
    type: day ? "bar" : "line",
    data: { labels: visibleDates(), datasets: [{
      data: values, backgroundColor: day ? alpha(colour, 0.75) : alpha(colour, 0.1), borderColor: colour,
      borderWidth: day ? 0 : 1.5, pointRadius: 0, fill: !day, tension: 0.3, barPercentage: 0.8, categoryPercentage: 1,
    }] },
    options: {
      events: [], layout: { padding: 1 },
      scales: { x: { display: false }, y: { display: false, beginAtZero: day } },
      plugins: { tooltip: { enabled: false } },
    },
  });
  spark.$overlay = { stretch: state.selection };
  spark.draw();
}

/* ---------- filters: range and measured stretch ---------- */

function renderRange() {
  const seg = document.getElementById("range");
  for (const days of RANGES) {
    const b = el("button", { type: "button", "aria-pressed": String(days === state.range), "aria-label": `Last ${days} days` }, `${days}D`);
    b.dataset.days = days;
    b.addEventListener("click", () => {
      state.range = days;
      state.hover = state.selection = null;
      seg.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(Number(x.dataset.days) === days)));
      refresh();
    });
    seg.append(b);
  }
  // The stretch chip names the measured stretch and clears it.
  document.getElementById("stretch-chip").addEventListener("click", () => { state.selection = null; refresh(); });
}

// Everything the filters drive, redrawn together on the next frame (one redraw however many inputs changed).
let refreshQueued = false;
function refresh() {
  if (refreshQueued) return;
  refreshQueued = true;
  requestAnimationFrame(() => {
    refreshQueued = false;
    const chip = document.getElementById("stretch-chip");
    chip.hidden = !state.selection;
    if (state.selection) {
      chip.replaceChildren(el("span", {}, `Stretch ${stretchLabel(state.selection)}`), " ✕");
      chip.setAttribute("aria-label", `Clear the measured stretch, ${stretchLabel(state.selection)}`);
    }
    renderKpis();
    renderPlatformCards();
    renderTimeline();
    renderCompare();
    if (activeTable) {
      activeTable.redraw();
      activeTable.updateNote();
    }
  });
}

/* ---------- timeline: the primary chart ---------- */

// Switching metrics keeps the measured stretch: the same days, read on another series.
function selectChart(key) {
  state.key = key;
  document.querySelectorAll("[data-key]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.key === key)));
  renderTimeline();
}

// The menu lists every series of the open tab (every platform's on the overview), grouped by platform.
function renderPicker() {
  const select = document.getElementById("metric");
  select.replaceChildren();
  for (const source of PLATFORM_NAMES) {
    if (state.tab !== "overview" && source !== state.tab) continue;
    const charts = [...CHARTS.values()].filter((c) => c.source === source)
      .sort((a, b) => (b.headline - a.headline) || (a.kind === b.kind ? 0 : a.kind === "day" ? -1 : 1));
    if (!charts.length) continue;
    const group = el("optgroup", { label: sourceName(source) });
    for (const c of charts) {
      const scope = c.kind === "snapshot" && c.entity_type !== "account" ? ` · all ${c.entity_type}s` : "";
      group.append(el("option", { value: c.key }, `${c.label}${scope}`));
    }
    select.append(group);
  }
}

// The open chart's visible values and where its data starts; shared by the chart, the readout, and the facts.
function timelineView() {
  const chart = CHARTS.get(state.key);
  if (!chart) return null;
  const dates = visibleDates(), values = valuesOf(visibleSeries(chart));
  return { chart, dates, values, n: values.length, offFrom: collectedFrom(chart, dates) };
}

// A panel with nothing to show keeps only its message: no menu, toggle, or empty chart area.
function showParts(ids, visible) {
  for (const id of ids) document.getElementById(id).hidden = !visible;
}

function renderTimeline() {
  const canvas = document.getElementById("timeline"), view = timelineView();
  document.getElementById("metric").value = state.key || "";
  showParts(["metric-wrap", "track", "daylog", "facts"], Boolean(view));
  if (!view) {
    Chart.getChart(canvas)?.destroy();
    showParts(["mode", "track-key"], false);
    document.getElementById("readout").textContent = "Nothing to chart yet. Once a collector runs, its numbers appear here.";
    return;
  }
  const { chart, dates, values, n, offFrom } = view, snapshot = chart.kind === "snapshot";
  const colour = sourceColor(chart.source), metric = chart.metric;
  canvas.setAttribute("aria-label", `${chart.label}, ${snapshot ? "running total by day" : "per day"}, ${spanLabel()}.`);
  document.getElementById("mode").hidden = snapshot;
  const cumulative = !snapshot && state.mode === "cumulative";
  const shown = values.map((v, i) => (i < offFrom ? null : v));
  const inStretch = (i) => !state.selection || (i >= state.selection[0] && i <= state.selection[1]);

  // Daily: bars plus a 7-day average line. Cumulative: the running total, filled. Running totals
  // (snapshots) are already levels: always a line, on an axis fitted to their own range, ending in a dot.
  let datasets;
  if (cumulative || snapshot) {
    const line = cumulative ? runningTotal(values, offFrom) : shown;
    const last = line.length - 1;
    datasets = [{
      type: "line", label: chart.label, data: line, borderColor: colour, backgroundColor: alpha(colour, 0.14),
      borderWidth: 2, fill: snapshot ? "start" : "origin", tension: 0.25, spanGaps: false,
      pointRadius: (ctx) => (snapshot && ctx.dataIndex === last ? 3.5 : 0), pointBackgroundColor: colour, pointHoverRadius: 4,
    }];
  } else {
    datasets = [
      { type: "bar", label: chart.label, data: shown, order: 2, borderRadius: 1, barPercentage: 0.7, categoryPercentage: 0.95,
        backgroundColor: (ctx) => (inStretch(ctx.dataIndex) ? colour : alpha(colour, 0.35)) },
      { type: "line", label: "7-day average", data: trailingAverage(values, offFrom), order: 1, borderColor: alpha(COLORS.ink, 0.7),
        borderWidth: 1.5, pointRadius: 0, pointHoverRadius: 0, tension: 0.3, spanGaps: false },
    ];
  }
  const timeline = upsertChart(canvas, {
    type: "bar",
    data: { labels: dates, datasets },
    options: {
      interaction: { mode: "index", intersect: false },
      onHover: (ev, items, ch) => setHover(ev.type === "mouseout" ? null : indexAt(ch, ev.x)),
      layout: { padding: { top: 14 } },
      scales: {
        x: { grid: { display: false }, ticks: { maxRotation: 0, autoSkipPadding: 18, callback(v) { return shortDate(this.getLabelForValue(v)); } } },
        y: { beginAtZero: !snapshot, grace: snapshot ? "8%" : 0, border: { display: false }, grid: { color: COLORS.rule },
             ticks: { maxTicksLimit: 5, callback: (v) => fmt(v, metric) } },
      },
      plugins: { tooltip: { callbacks: {
        title: (items) => dayName(items[0].label),
        label: (ctx) => (ctx.raw === null ? null : `${ctx.dataset.label}: ${fmt(ctx.raw, metric)}${cumulative ? " so far" : ""}`),
        footer: (items) => eventsOn(items[0].label, chart).map((e) => (e.kind === "release" ? "▲ " : "◆ ") + e.label),
      } } },
    },
  });
  const events = [];
  dates.forEach((d, i) => {
    const list = eventsOn(d, chart);
    if (list.length) events.push({ index: i, count: list.length, kind: list.some((e) => e.kind === "release") ? "release" : "thumbnail" });
  });
  timeline.$overlay = {
    offFrom, events, stretch: state.selection,
    hatchLabel: `${snapshot ? "no readings before" : "not collected before"} ${chart.first ? shortDate(chart.first) : ""}`,
  };
  timeline.draw();
  document.getElementById("track-key").hidden = cumulative || snapshot;
  renderFacts(view);
  updateReadout();
  // Redrawing drops the tooltip; put it back on the day a keyboard user is reading.
  if (state.hover !== null && document.activeElement === document.getElementById("track")) showDay(state.hover);
}

// The visible-day index under a pixel x position on the chart.
function indexAt(chart, px) {
  const n = chart.data.labels.length;
  if (!n || !Number.isFinite(px)) return null;
  return Math.min(n - 1, Math.max(0, Math.round(chart.scales.x.getValueForPixel(px))));
}

function setHover(i) {
  if (i === state.hover) return;
  state.hover = i;
  updateReadout();
}

// Rewrites the readout above the chart and the release chips below it, for the hovered day, the stretch, or the range.
function updateReadout() {
  const view = timelineView(), readout = document.getElementById("readout"), log = document.getElementById("daylog");
  if (!view) return;
  readout.replaceChildren();
  log.replaceChildren();
  const { chart, dates, values, n, offFrom } = view, metric = chart.metric, label = chart.label.toLowerCase();
  const main = (text) => readout.append(el("span", { class: "r-main" }, text));
  const sub = (text, cls = "r-sub") => readout.append(el("span", { class: cls }, text));
  const sel = state.selection, at = (i) => (i < offFrom ? null : values[i]);
  const cumulative = state.mode === "cumulative" && chart.kind === "day";
  let logEvents, lead;
  if (sel) {
    const [a, b] = sel;
    if (chart.kind === "snapshot") {
      const { base, end, value } = levelChange(chart, sel);
      main(`${fmtSigned(value, metric)} ${label}`);
      sub(`${stretchLabel(sel)} · ${fmt(base, metric)} → ${fmt(end, metric)}`);
    } else {
      const days = b - a + 1, total = sum(values.slice(a, b + 1));
      main(`${fmt(total, metric)} ${label}`);
      sub(`${stretchLabel(sel)} · ${days} days · ${fmt(total / days, metric)}/day`);
    }
    logEvents = dates.slice(a, b + 1).flatMap((d) => eventsOn(d, chart));
    lead = logEvents.length ? "in this stretch" : "nothing released in this stretch · esc or the ✕ clears it";
  } else if (state.hover !== null) {
    const i = state.hover, v = cumulative ? runningTotal(values, offFrom)[i] : at(i);
    const missing = chart.kind === "snapshot" ? "no reading yet" : "not collected";
    main(v === null ? missing : `${fmt(v, metric)} ${label}${cumulative ? " so far" : ""}`);
    sub(dayName(dates[i]));
    logEvents = eventsOn(dates[i], chart);
    if (logEvents.length) sub(`${logEvents.length} event${logEvents.length > 1 ? "s" : ""} this day`, "r-cue");
    lead = logEvents.length ? "on this day" : "drag across the chart to measure a stretch";
  } else {
    // Resting: the range at a glance (a level and how far it moved, or a total and the best day), then recent events.
    if (chart.kind === "snapshot") {
      const last = values[n - 1], first = at(offFrom);
      main(`${fmt(last, metric)} ${label}`);
      sub(offFrom < n - 1 ? `latest · ${fmtSigned(last - first, metric)} since ${shortDate(dates[offFrom])}` : "latest");
    } else {
      const total = sum(values), peak = Math.max(...values), peakDay = dates[values.indexOf(peak)];
      main(`${fmt(total, metric)} ${label}`);
      sub(peak > 0 ? `last ${n} days · best day ${shortDate(peakDay)} (${fmt(peak, metric)})` : `last ${n} days`);
    }
    logEvents = dates.flatMap((d) => eventsOn(d, chart)).reverse();
    lead = logEvents.length ? "recent" : "hover to read a day · drag to measure a stretch";
  }
  log.append(el("span", {}, lead));
  // One chip per day and kind ("Oct 28 · 6 new thumbnails"), newest first; the tooltip lists each one.
  const groups = new Map();
  for (const e of logEvents) groups.set(`${e.date}|${e.kind}`, [...(groups.get(`${e.date}|${e.kind}`) || []), e]);
  const shown = [...groups.values()].slice(0, 5);
  for (const events of shown) {
    const { date, kind } = events[0];
    const what = events.length > 1
      ? `${events.length} ${kind === "release" ? "releases" : "new thumbnails"}`
      : kind === "release" ? splitTitle(events[0].label).guest : `new thumbnail · ${splitTitle(events[0].label.replace(/^New thumbnail: /, "")).guest}`;
    const chip = el("button", { type: "button", class: `chip ${kind}`, title: events.map((e) => e.label).join("\n") });
    chip.append(el("span", { class: "k", "aria-hidden": "true" }), el("span", {}, `${shortDate(date)} · ${what}`));
    chip.addEventListener("click", () => { state.selection = null; showDay(dates.indexOf(date)); refresh(); });
    log.append(chip);
  }
  if (groups.size > shown.length) log.append(el("span", {}, `+${groups.size - shown.length} more days`));
}

// Puts the tooltip on one day, for keyboard users and the release chips.
function showDay(i) {
  const timeline = Chart.getChart(document.getElementById("timeline"));
  if (!timeline || i === null || i < 0) return;
  const active = timeline.data.datasets.map((d, datasetIndex) => ({ datasetIndex, index: i })).filter((e) => timeline.data.datasets[e.datasetIndex].data[i] != null);
  timeline.setActiveElements(active);
  timeline.tooltip.setActiveElements(active, { x: timeline.scales.x.getPixelForValue(i), y: timeline.chartArea.top });
  timeline.update("none");
  setHover(i);
}

// Pointer: hover reads a day (via Chart.js), dragging measures a stretch; letting go applies it as a filter everywhere.
// Keyboard: arrows move a day, shift+arrows measure, Escape clears.
function wireTimeline() {
  const track = document.getElementById("track"), canvas = document.getElementById("timeline");
  let anchor = null;
  const at = (ev) => {
    const chart = Chart.getChart(canvas);
    return chart ? indexAt(chart, ev.clientX - canvas.getBoundingClientRect().left) : null;
  };
  const drawStretch = () => {
    const chart = Chart.getChart(canvas);
    if (!chart) return;
    chart.$overlay.stretch = state.selection;
    chart.update("none");
    updateReadout();
  };
  canvas.addEventListener("pointerdown", (ev) => {
    anchor = at(ev);
    if (anchor === null) return;
    state.selection = null;
    canvas.setPointerCapture(ev.pointerId);
    drawStretch();
  });
  canvas.addEventListener("pointermove", (ev) => {
    if (anchor === null) return;
    const i = at(ev);
    state.selection = i === anchor ? null : [Math.min(anchor, i), Math.max(anchor, i)];
    drawStretch();
  });
  canvas.addEventListener("pointerup", () => { if (anchor !== null) { anchor = null; refresh(); } });
  canvas.addEventListener("pointerleave", () => { if (anchor === null) setHover(null); });
  track.addEventListener("keydown", (ev) => {
    const last = state.range - 1, from = state.hover ?? last;
    const moves = { ArrowLeft: from - 1, ArrowRight: from + 1, Home: 0, End: last };
    if (ev.key === "Escape") { state.selection = state.hover = null; refresh(); return; }
    if (!(ev.key in moves)) return;
    ev.preventDefault();
    const next = Math.min(last, Math.max(0, moves[ev.key]));
    if (ev.shiftKey) {
      const [a, b] = state.selection || [from, from];
      state.selection = next < a ? [next, b] : next > b ? [a, next] : from === a ? [next, b] : [a, next];
      refresh();
    }
    showDay(next);
  });
  document.querySelectorAll("#mode button").forEach((b) => b.addEventListener("click", () => {
    state.mode = b.dataset.mode;
    document.querySelectorAll("#mode button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    renderTimeline();
  }));
  document.getElementById("metric").addEventListener("change", (ev) => selectChart(ev.target.value));
}

/* ---------- derived numbers under the timeline ---------- */

// Ratios of two daily metrics from the same source (never mixed across sources), over the filtered days.
const RATIOS = [
  { label: "Watch time per view", num: "youtube.watch_minutes.show", den: "youtube.views.show", scale: 1, unit: " min" },
  { label: "Subscribers per 1k views", num: "youtube.subscribers_gained.show", den: "youtube.views.show", scale: 1000, unit: "" },
];
const WEEKDAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

function renderFacts({ chart, dates, values, offFrom }) {
  const box = document.getElementById("facts");
  box.replaceChildren();
  const rows = [];
  let note = null;
  const collected = values.slice(offFrom);
  if (chart.kind === "snapshot") {
    // A running total: where it stands, how far it moved, and what it adds up.
    const last = collected[collected.length - 1];
    rows.push(["Latest", fmt(last, chart.metric)], ["First reading", chart.first ? shortDate(chart.first) : "–"]);
    if (collected.length > 1) rows.push([`Change since ${shortDate(dates[offFrom])}`, fmtSigned(last - collected[0], chart.metric)]);
    if (collected.length > 7) rows.push(["Change, last 7 days", fmtSigned(last - collected[collected.length - 8], chart.metric)]);
    if (chart.entity_type !== "account") rows.push([`Tracked ${chart.entity_type}s`, String(chart.tracked)]);
    note = chart.entity_type === "account" ? "A running count, read once a day."
      : `The sum of every tracked ${chart.entity_type}'s latest reading, so a new ${chart.entity_type} shows up as a step.`;
  } else {
    // A daily number: typical day, current pace, this week against last, best weekday, and ratios.
    const days = collected.length;
    rows.push(["Days with data", `${days} of ${values.length}`]);
    if (days) rows.push(["Daily average", fmt(sum(collected) / days, chart.metric)]);
    if (days >= 7) rows.push(["Last 7 days, per day", fmt(sum(collected.slice(-7)) / 7, chart.metric)]);
    if (days >= 14) {
      const thisWeek = sum(collected.slice(-7)), lastWeek = sum(collected.slice(-14, -7));
      if (lastWeek > 0) {
        const pct = Math.round(((thisWeek - lastWeek) / lastWeek) * 100);
        rows.push(["This week vs last", el("span", { class: `delta ${pct >= 0 ? "up" : "down"}` }, `${pct >= 0 ? "↑" : "↓"} ${Math.abs(pct)}%`)]);
      }
      const totals = Array(7).fill(0), counts = Array(7).fill(0);
      dates.slice(offFrom).forEach((d, i) => {
        const wd = (new Date(`${d}T00:00:00Z`).getUTCDay() + 6) % 7;
        totals[wd] += collected[i];
        counts[wd] += 1;
      });
      const avgs = totals.map((t, i) => (counts[i] ? t / counts[i] : 0)), best = avgs.indexOf(Math.max(...avgs));
      rows.push(["Best weekday", `${WEEKDAYS[best]} · ${fmt(avgs[best], chart.metric)}`]);
    } else {
      note = "Week-over-week and weekday patterns appear after 14 days of data.";
    }
    for (const r of RATIOS) {
      const a = CHARTS.get(r.num), b = CHARTS.get(r.den);
      if (chart.source !== a?.source || !b) continue;
      const den = spanSum(valuesOf(b.series));
      if (den) rows.push([r.label, `${fmt((spanSum(valuesOf(a.series)) / den) * r.scale)}${r.unit}`]);
    }
  }
  const dl = el("dl", { class: "facts-strip" });
  for (const [label, value] of rows) {
    const row = el("div"), dd = el("dd");
    dd.append(value);
    row.append(el("dt", {}, label), dd);
    dl.append(row);
  }
  box.append(dl);
  if (note) box.append(el("p", { class: "facts-note" }, note));
  // On the overview, a way into the platform this series comes from.
  if (state.tab === "overview" && PLATFORM_NAMES.has(chart.source)) {
    const link = el("a", { class: "open-link", href: `#${chart.source}` });
    link.append(sourceDot(chart.source), `Every ${sourceName(chart.source)} number →`);
    box.append(link);
  }
}

/* ---------- compare: the secondary chart ---------- */

// What the compare chart can show on the open tab, each as a ranked list of [name, value] for the filtered days:
// audience breakdowns (apps, countries, ...), top episodes for each daily metric, and top posts or videos.
function compareOptions() {
  const mine = (source) => state.tab === "overview" || source === state.tab;
  const options = [];
  for (const b of DATA.breakdowns.filter((x) => mine(x.source))) {
    options.push({
      id: `b:${b.source}.${b.metric}.${b.kind}`, title: `${b.label} by ${b.kind}`, source: b.source, metric: b.metric, filtered: true,
      rows: () => Object.entries(b.daily || {}).map(([name, daily]) => ({ name, value: spanSum(daily) })),
      other: () => spanSum(b.other_daily || []),
    });
  }
  const dayColumns = DATA.episodes.columns.filter((c) => c.kind === "day" && mine(c.source) && (state.tab !== "overview" || c.headline));
  for (const c of dayColumns) {
    const daily = DATA.episode_daily[c.key] || {};
    if (!Object.keys(daily).length) continue;
    options.push({
      id: `e:${c.key}`, title: `Top episodes · ${c.label}`, source: c.source, metric: c.metric, filtered: true, episodes: true,
      rows: () => Object.entries(daily).map(([slug, values]) => ({ name: splitTitle(EPISODE_TITLES.get(slug) || slug).guest, slug, value: spanSum(values) })),
    });
  }
  for (const t of DATA.items.filter((x) => mine(x.source) && x.rows.length)) {
    const columns = state.tab === "overview" ? t.columns.slice(0, 1) : t.columns;
    for (const c of columns) {
      options.push({
        id: `i:${t.source}.${t.entity_type}.${c.key}`, title: `Top ${t.entity_type}s · ${c.label}`, source: t.source, metric: c.key, filtered: false,
        rows: () => t.rows.filter((r) => has(r.values[c.key]))
          .map((r) => ({ name: r.label || r.id, value: r.values[c.key], url: safeHref(r.url) })),
      });
    }
  }
  // Comparisons of headline metrics come first, so the chart opens on one that matters.
  const headline = (o) => DATA.numbers.some((n) => n.source === o.source && n.metric === o.metric && n.headline);
  return options.sort((a, b) => headline(b) - headline(a));
}

function renderCompare() {
  const select = document.getElementById("compare-pick"), canvas = document.getElementById("compare");
  const note = document.getElementById("compare-note"), options = compareOptions();
  select.replaceChildren(...options.map((o) => el("option", { value: o.id }, `${o.title}${state.tab === "overview" ? ` · ${sourceName(o.source)}` : ""}`)));
  showParts(["compare-pick-wrap", "compare-box"], options.length > 0);
  if (!options.length) {
    Chart.getChart(canvas)?.destroy();
    note.className = "compare-note";
    note.textContent = "Nothing to compare yet: breakdowns, episodes, and posts appear here once collected.";
    return;
  }
  const pick = options.find((o) => o.id === state.compare[state.tab]) || options[0];
  select.value = pick.id;
  const all = pick.rows().filter((r) => r.value > 0).sort((a, b) => b.value - a.value);
  const top = all.slice(0, TOP_ROWS), rest = sum(all.slice(TOP_ROWS).map((r) => r.value)) + (pick.other ? pick.other() : 0);
  const total = sum(top.map((r) => r.value)) + rest, colour = sourceColor(pick.source);
  document.getElementById("compare-box").style.height = `${Math.max(140, top.length * 22 + 30)}px`;
  canvas.setAttribute("aria-label", `${pick.title}: ${top.map((r) => `${r.name} ${fmt(r.value, pick.metric)}`).join(", ")}`);
  upsertChart(canvas, {
    type: "bar",
    data: { labels: top.map((r) => r.name), datasets: [{ data: top.map((r) => r.value), backgroundColor: alpha(colour, 0.8),
            hoverBackgroundColor: colour, borderRadius: 2, barPercentage: 0.75 }] },
    options: {
      indexAxis: "y",
      onClick: (ev, items) => { if (items.length) openCompareRow(pick, top[items[0].index]); },
      onHover: (ev, items) => { ev.native.target.style.cursor = items.length && (pick.episodes || top[items[0].index]?.url) ? "pointer" : "default"; },
      scales: {
        x: { beginAtZero: true, border: { display: false }, grid: { color: COLORS.rule }, ticks: { maxTicksLimit: 4, callback: (v) => fmt(v, pick.metric) } },
        y: { grid: { display: false }, ticks: { color: COLORS.muted, callback(v) { const s = this.getLabelForValue(v); return s.length > 20 ? `${s.slice(0, 19)}…` : s; } } },
      },
      plugins: { tooltip: { callbacks: {
        title: (items) => top[items[0].dataIndex].name,
        label: (ctx) => `${fmt(ctx.raw, pick.metric)}${total ? ` · ${Math.round((ctx.raw / total) * 100)}%` : ""}`,
        footer: () => (pick.episodes ? "click to find it in the episode table" : top[0]?.url ? "click to open it" : ""),
      } } },
    },
  });
  note.className = `compare-note${pick.filtered && state.selection ? " stretch" : ""}`;
  const others = rest > 0 ? `everything else · ${fmt(rest, pick.metric)} · ` : "";
  note.textContent = `${others}${pick.filtered ? spanLabel() : "latest readings · not affected by the range"}`;
}

// A bar in the compare chart: an episode is found in the episode table; a post or video opens on its platform.
function openCompareRow(pick, row) {
  if (pick.episodes && activeTable) {
    activeTable.search(row.name);
    activeTable.mount.scrollIntoView({ block: "start" });
  } else if (row.url) {
    window.open(row.url, "_blank", "noopener,noreferrer");
  }
}

function wireCompare() {
  document.getElementById("compare-pick").addEventListener("change", (ev) => {
    state.compare[state.tab] = ev.target.value;
    renderCompare();
  });
}

/* ---------- tables ---------- */

function searchIcon() {
  const svg = el("svg:svg", { viewBox: "0 0 24 24", "aria-hidden": "true" });
  svg.append(el("svg:circle", { cx: 11, cy: 11, r: 7 }), el("svg:path", { d: "M20 20l-4-4" }));
  return svg;
}

// A searchable, sortable, paged table with in-cell bars and optional expandable rows. `columns` may be a
// function, re-read on every redraw, so filter-driven columns (range totals) follow the filters.
// columns: [{key, label, sub, subClass, source, numeric, metric, title, get(row), render(row, ctl) -> Node|string}]
// Returns {mount, redraw(), search(text)}.
function dataTable(mount, { noun, columns, rows, searchText, defaultSort, detail, filterLabel, hasData, onlyDataFirst = false }) {
  const columnsNow = typeof columns === "function" ? columns : () => columns;
  let sortKey = defaultSort, ascending = false, query = "", onlyData = onlyDataFirst, page = 0;
  const open = new Set();

  const tools = el("div", { class: "tools" });
  const search = el("label", { class: "search" });
  const input = el("input", { type: "search", placeholder: `find ${noun}s`, autocomplete: "off" });
  search.append(searchIcon(), el("span", { class: "visually-hidden" }, `Find ${noun}s`), input);
  tools.append(search);
  let toggle = null;
  if (filterLabel) {
    toggle = el("input", { type: "checkbox", checked: onlyData ? "" : null });
    const lab = el("label", { class: "toggle" });
    lab.append(toggle, el("span", {}, filterLabel));
    tools.append(lab);
  }
  const count = el("span", { class: "count", "aria-live": "polite" });
  tools.append(count);
  const wrap = el("div", { class: "table-wrap panel" });
  const table = el("table");
  wrap.append(table);
  const pager = el("div", { class: "pager" });
  const prev = el("button", { type: "button" }, "‹ previous"), next = el("button", { type: "button" }, "next ›"), where = el("span");
  pager.append(prev, next, where);
  mount.append(tools, wrap, pager);

  function draw() {
    const cols = columnsNow();
    // Filter, sort, then show one page (a search searches every row).
    const q = query.trim().toLowerCase();
    const filtered = rows.filter((r) => (!q || searchText(r).toLowerCase().includes(q)) && (!onlyData || hasData(r)));
    const col = cols.find((c) => c.key === sortKey) || cols[0];
    const sorted = [...filtered].sort((a, b) => {
      const va = col.get(a), vb = col.get(b);
      // Missing values always sink to the bottom, whichever direction.
      if (!has(va) || va === "") return 1;
      if (!has(vb) || vb === "") return -1;
      const cmp = typeof va === "number" ? va - vb : String(va).localeCompare(String(vb));
      return ascending ? cmp : -cmp;
    });
    const pages = Math.max(1, Math.ceil(sorted.length / PAGE_SIZE));
    page = Math.min(page, pages - 1);
    const visible = sorted.slice(page * PAGE_SIZE, (page + 1) * PAGE_SIZE);
    count.textContent = filtered.length === rows.length ? `${rows.length} ${noun}s` : `${filtered.length} of ${rows.length} ${noun}s`;
    pager.hidden = sorted.length <= PAGE_SIZE;
    prev.disabled = page === 0;
    next.disabled = page >= pages - 1;
    where.textContent = `Showing ${page * PAGE_SIZE + 1}–${page * PAGE_SIZE + visible.length} of ${sorted.length}`;

    // Column maxima scale the in-cell bars.
    const maxima = Object.fromEntries(cols.filter((c) => c.numeric).map((c) => [c.key, Math.max(0, ...filtered.map((r) => c.get(r) || 0))]));

    table.replaceChildren();
    const head = el("tr");
    for (const c of cols) {
      const th = el("th", { class: c.numeric ? "n" : "", scope: "col" });
      if (c.key === sortKey) th.setAttribute("aria-sort", ascending ? "ascending" : "descending");
      const btn = el("button", { type: "button", title: c.title || "" });
      btn.append(el("span", { class: "label" }, c.label));
      if (c.sub) {
        const sub = el("span", { class: `th-sub${c.subClass ? ` ${c.subClass}` : ""}` });
        if (c.source) sub.append(sourceDot(c.source));
        sub.append(el("span", {}, c.sub));
        btn.append(sub);
      }
      btn.addEventListener("click", () => {
        ascending = c.key === sortKey ? !ascending : !c.numeric;
        sortKey = c.key;
        page = 0;
        draw();
      });
      th.append(btn);
      head.append(th);
    }
    const thead = el("thead");
    thead.append(head);
    const body = el("tbody");
    for (const row of visible) {
      const tr = el("tr");
      for (const c of cols) {
        const value = c.get(row);
        const td = el("td", { class: c.numeric ? "n" : "" });
        if (c.numeric) {
          if (!has(value)) {
            td.classList.add("empty-val");
            td.textContent = "–";
          } else {
            const bar = tint(el("span", { class: "cell-bar", "aria-hidden": "true" }), c.source);
            bar.style.width = `${maxima[c.key] ? (value / maxima[c.key]) * 100 : 0}%`;
            td.append(bar, el("span", { class: "cell-val" }, fmt(value, c.metric)));
          }
        } else {
          const ctl = { open: open.has(row), toggle: () => { open.has(row) ? open.delete(row) : open.add(row); draw(); } };
          td.append(c.render ? c.render(row, ctl) : (value ?? "–"));
        }
        tr.append(td);
      }
      body.append(tr);
      if (detail && open.has(row)) {
        const dtr = el("tr", { class: "detail" });
        const dtd = el("td", { colspan: cols.length });
        dtd.append(detail(row));
        dtr.append(dtd);
        body.append(dtr);
      }
    }
    if (!visible.length) {
      const tr = el("tr");
      tr.append(el("td", { colspan: cols.length, class: "empty" }, q ? `No ${noun}s match “${query.trim()}”.` : `No ${noun}s to show.`));
      body.append(tr);
    }
    table.append(thead, body);
  }

  input.addEventListener("input", () => { query = input.value; page = 0; draw(); });
  if (toggle) toggle.addEventListener("change", () => { onlyData = toggle.checked; page = 0; draw(); });
  prev.addEventListener("click", () => { page -= 1; draw(); });
  next.addEventListener("click", () => { page += 1; draw(); });
  draw();
  return {
    mount,
    redraw: draw,
    search(text) {
      input.value = query = text;
      if (toggle) toggle.checked = onlyData = false;
      page = 0;
      draw();
    },
  };
}

// The episode table on the open tab; the filters redraw it and the compare chart searches it.
let activeTable = null;

// The episode table for some columns (the overview's headline ones, or one platform's). Each daily column gets a
// companion that totals the filtered days, first, so the table follows the range and the stretch.
// An expanded row lists every number the episode has, from every platform. Returns a summary line.
function renderEpisodes(mount, columns, note, { onlyWithData = false } = {}) {
  const rows = DATA.episodes.rows;
  // Columns with no value for any episode add nothing but width.
  const shown = columns.filter((c) => rows.some((r) => has(r.values[c.key])));
  // Range columns, the one covering the most episodes first (it's also the default sort).
  const coverage = (c) => Object.keys(DATA.episode_daily[c.key]).length;
  const ranged = shown.filter((c) => c.kind === "day" && DATA.episode_daily[c.key]).sort((a, b) => coverage(b) - coverage(a));
  const hasData = (r) => shown.some((c) => r.values[c.key]);
  const linkedItems = (slug) => DATA.items.flatMap((t) => t.rows.filter((r) => r.episode_slug === slug).map((r) => ({ ...r, source: t.source, type: t.entity_type })));

  const fixed = [
    { key: "title", label: "Episode", get: (r) => splitTitle(r.title).guest, render: (r, ctl) => {
        const { guest, topic } = splitTitle(r.title);
        const box = el("div", { class: "ep" });
        const btn = el("button", { type: "button", class: "disclose", "aria-expanded": String(ctl.open), "aria-label": `Details for ${guest}` }, ctl.open ? "−" : "+");
        btn.addEventListener("click", ctl.toggle);
        const text = el("div", { class: "ep-text" });
        text.append(el("div", { class: "ep-guest" }, guest));
        if (topic) text.append(el("div", { class: "ep-topic", title: topic }, topic));
        box.append(btn, text);
        return box;
      } },
    { key: "published_on", label: "Released", get: (r) => r.published_on, render: (r) => el("span", { class: "faint nowrap" }, r.published_on || "–") },
  ];
  const stored = shown.map((c) => {
    const launch = c.kind === "launch";
    return {
      key: c.key, numeric: true, source: c.source, title: c.basis, metric: c.metric,
      label: launch ? c.label.replace(/, first \d+d$/, "") : c.label, sub: launch ? `${c.source} · first 7d` : `${c.source} · all time`,
      get: (r) => r.values[c.key],
    };
  });
  const columnsNow = () => [...fixed, ...ranged.map((c) => ({
    key: `${c.key}.span`, numeric: true, source: c.source, metric: c.metric, label: c.label, title: "total over the filtered days",
    sub: spanLabel(), subClass: state.selection ? "stretch" : "",
    get: (r) => { const daily = DATA.episode_daily[c.key][r.slug]; return daily ? spanSum(daily) : null; },
  })), ...stored];

  // Expanded row: only the numbers that exist (basis on hover), then linked posts and videos, thumbnail changes, slug.
  const detail = (r) => {
    const box = el("div", { class: "detail" });
    const facts = el("dl", { class: "facts" });
    for (const c of DATA.episodes.columns) {
      const value = r.values[c.key];
      if (!has(value)) continue;
      const fact = el("div", { class: "fact", title: `${sourceName(c.source)} · ${c.basis}` });
      const dt = el("dt");
      dt.append(sourceDot(c.source), el("span", {}, c.label));
      fact.append(dt, el("dd", {}, fmt(value, c.metric)));
      facts.append(fact);
    }
    if (facts.children.length) box.append(facts);
    const links = el("ul", { class: "detail-links" });
    for (const it of linkedItems(r.slug)) {
      const li = el("li");
      const href = safeHref(it.url);
      // The platform name opens its tab; the item's text opens the post or video itself.
      li.append(el("a", { href: `#${it.source}` }, `${sourceName(it.source)} ${it.type}`), " · ",
        href ? el("a", { href, target: "_blank", rel: "noopener noreferrer" }, it.label || it.id) : (it.label || it.id));
      links.append(li);
    }
    const changes = DATA.events.filter((e) => e.kind === "thumbnail" && e.slug === r.slug);
    if (changes.length) links.append(el("li", {}, `thumbnail changed · ${changes.map((e) => shortDate(e.date)).join(", ")}`));
    links.append(el("li", {}, `slug · ${r.slug}`));
    box.append(links);
    return box;
  };

  activeTable = dataTable(mount, {
    noun: "episode", columns: columnsNow, rows, detail, hasData, onlyDataFirst: onlyWithData,
    filterLabel: "only with numbers", searchText: (r) => `${r.title} ${r.slug}`,
    defaultSort: ranged.length ? `${ranged[0].key}.span` : shown.length ? shown[0].key : "published_on",
  });
  // The section note says how many episodes have numbers and, when range columns exist, what they cover.
  const summary = `${rows.filter(hasData).length} of ${rows.length} have numbers`;
  activeTable.updateNote = () => {
    note.textContent = ranged.length ? `${summary} · range columns: ${spanLabel()}` : summary;
    note.classList.toggle("stretch", Boolean(ranged.length && state.selection));
  };
  activeTable.updateNote();
}

// One platform's tracked posts or videos, with every number collected for each (latest readings).
function renderItemTable(mount, t) {
  const noun = t.entity_type;
  const cols = [
    { key: "created_at", label: "Published", get: (r) => r.created_at, render: (r) => el("span", { class: "faint nowrap" }, (r.created_at || "").slice(0, 10) || "–") },
    { key: "label", label: noun, get: (r) => r.label, render: (r) => {
        const href = safeHref(r.url);
        const attrs = { class: "item-label", title: r.label || "" };
        return href ? el("a", { ...attrs, href, target: "_blank", rel: "noopener noreferrer" }, r.label || "(no text)") : el("span", attrs, r.label || "");
      } },
    { key: "episode_slug", label: "Episode", get: (r) => r.episode_slug, render: (r) => r.episode_slug ? splitTitle(EPISODE_TITLES.get(r.episode_slug) || r.episode_slug).guest : "–" },
    ...t.columns.map((c) => ({ key: c.key, label: c.label, numeric: true, source: t.source, metric: c.key, get: (r) => r.values[c.key] })),
  ];
  // Derived: likes plus comments per 1,000 views, when the item reports all three.
  const viewsKey = t.columns.map((c) => c.key).find((k) => k.includes("views"));
  const keys = new Set(t.columns.map((c) => c.key));
  if (viewsKey && keys.has("likes") && keys.has("comments")) {
    cols.push({
      key: "engagement", label: "Engagement", sub: "per 1k views", numeric: true, source: t.source,
      title: "(likes + comments) per 1,000 views",
      get: (r) => (r.values[viewsKey] ? (((r.values.likes || 0) + (r.values.comments || 0)) / r.values[viewsKey]) * 1000 : null),
    });
  }
  dataTable(mount, { noun, columns: cols, rows: t.rows, defaultSort: "created_at", searchText: (r) => `${r.label || ""} ${r.episode_slug || ""}` });
}

/* ---------- back catalog: how the whole archive performs ---------- */

// Episode metrics worth plotting: not launch-window columns, filled for at least five episodes, headline first.
const CATALOG_COLUMNS = DATA.episodes.columns
  .filter((c) => c.kind !== "launch")
  .map((c) => ({ ...c, filled: DATA.episodes.rows.filter((r) => has(r.values[c.key])).length }))
  .filter((c) => c.filled >= 5)
  .sort((a, b) => (b.headline - a.headline) || (b.filled - a.filled));

function renderCatalog() {
  const section = document.getElementById("catalog");
  if (!CATALOG_COLUMNS.length) { section.hidden = true; return; }
  const select = document.getElementById("catalog-metric"), body = document.getElementById("catalog-body");
  for (const c of CATALOG_COLUMNS) select.append(el("option", { value: c.key }, `${c.label} · ${sourceName(c.source)}`));
  const kpis = el("div", { class: "kpis" }), plots = el("div", { class: "plots" });
  const plot = (cls, title) => {
    const box = el("div", { class: `plot ${cls}` }), head = el("div", { class: "plot-title" }), note = el("span", { class: "faint" });
    head.append(el("span", { class: "label" }, title), note);
    const holder = el("div", { class: "chart-box" }), canvas = el("canvas", { role: "img" });
    holder.append(canvas);
    box.append(head, holder);
    plots.append(box);
    return { canvas, note };
  };
  const scatter = plot("wide", "Every episode by release date");
  const years = plot("half", "By release year");
  const curve = plot("half", "Share held by the top episodes");
  body.append(kpis, plots);

  function draw() {
    const col = CATALOG_COLUMNS.find((c) => c.key === select.value) || CATALOG_COLUMNS[0], colour = sourceColor(col.source);
    const points = DATA.episodes.rows
      .filter((r) => r.published_on && has(r.values[col.key]))
      .map((r) => ({ row: r, v: r.values[col.key], time: Date.parse(`${r.published_on}T00:00:00Z`) }));
    const name = col.label.toLowerCase();

    // Numbers about the archive as a whole.
    const values = points.map((p) => p.v), total = sum(values), sorted = [...values].sort((a, b) => b - a), k = Math.min(10, sorted.length);
    const yearAgo = new Date(Date.parse(`${DATA.today}T00:00:00Z`) - 365 * 864e5).toISOString().slice(0, 10);
    const older = sum(points.filter((p) => p.row.published_on < yearAgo).map((p) => p.v));
    kpis.replaceChildren();
    for (const [label, value] of [
      [`Total ${name}`, fmt(total, col.metric)], ["Episodes with data", String(points.length)],
      ["Median per episode", points.length ? fmt(median(values), col.metric) : "–"],
      [`Top ${k} episodes hold`, total ? `${Math.round((sum(sorted.slice(0, k)) / total) * 100)}%` : "–"],
      ["From episodes over a year old", total ? `${Math.round((older / total) * 100)}%` : "–"],
    ]) {
      const kpi = el("div");
      kpi.append(el("span", { class: "v" }, value), el("span", { class: "l" }, label));
      kpis.append(kpi);
    }

    // Release date (x) against the metric (log y): evergreen episodes stand out, newest sit on the right.
    const positive = points.filter((p) => p.v > 0), top3 = [...positive].sort((a, b) => b.v - a.v).slice(0, 3);
    const t0 = Math.min(...points.map((p) => p.time)), t1 = Math.max(...points.map((p) => p.time));
    scatter.note.textContent = `log scale · hover a dot${points.length > positive.length ? ` · ${points.length - positive.length} at zero not shown` : ""}`;
    scatter.canvas.setAttribute("aria-label", `${col.label} by release date for ${positive.length} episodes`);
    const sc = upsertChart(scatter.canvas, {
      type: "scatter",
      data: { datasets: [{ data: positive.map((p) => ({ x: p.time, y: p.v, p })), backgroundColor: alpha(colour, 0.7),
              hoverBackgroundColor: colour, pointRadius: (ctx) => (top3.includes(ctx.raw?.p) ? 5 : 3.5), pointHoverRadius: 6 }] },
      options: {
        layout: { padding: { right: 12 } },
        scales: {
          x: { type: "linear", min: t0, max: t1, grid: { display: false },
               afterBuildTicks: (axis) => {
                 const ticks = [];
                 for (let y = new Date(t0).getUTCFullYear() + 1; Date.UTC(y, 0, 1) <= t1; y++) ticks.push({ value: Date.UTC(y, 0, 1) });
                 axis.ticks = ticks;
               },
               ticks: { callback: (v) => String(new Date(v).getUTCFullYear()) } },
          y: { type: "logarithmic", border: { display: false }, grid: { color: COLORS.rule },
               ticks: { callback: (v) => (Number.isInteger(Math.log10(v)) ? fmt(v) : "") } },
        },
        plugins: { tooltip: { callbacks: {
          title: (items) => splitTitle(items[0].raw.p.row.title).guest,
          label: (ctx) => [`${fmt(ctx.raw.y, col.metric)} ${name}`, `released ${ctx.raw.p.row.published_on}`],
        } } },
      },
    });
    // Name the three biggest so the plot reads without hovering.
    sc.$overlay = { labels: top3.map((p) => ({ x: p.time, y: p.v, text: splitTitle(p.row.title).guest, dx: p.time > t0 + (t1 - t0) * 0.8 ? -9 : 9 })) };
    sc.draw();

    // Total per release year as bars, with the per-episode average on hover.
    const byYear = new Map();
    for (const p of points) {
      const yr = p.row.published_on.slice(0, 4), g = byYear.get(yr) || { total: 0, count: 0 };
      g.total += p.v;
      g.count += 1;
      byYear.set(yr, g);
    }
    const yearRows = [...byYear.entries()].sort(([a], [b]) => a.localeCompare(b));
    years.note.textContent = "total · hover for per episode";
    years.canvas.setAttribute("aria-label", yearRows.map(([yr, g]) => `${yr}: ${fmt(g.total, col.metric)}`).join(", "));
    upsertChart(years.canvas, {
      type: "bar",
      data: { labels: yearRows.map(([yr]) => yr), datasets: [{ data: yearRows.map(([, g]) => g.total), backgroundColor: alpha(colour, 0.85),
              hoverBackgroundColor: colour, borderRadius: 2, barPercentage: 0.7 }] },
      options: {
        scales: { x: { grid: { display: false } },
                  y: { beginAtZero: true, border: { display: false }, grid: { color: COLORS.rule }, ticks: { maxTicksLimit: 4, callback: (v) => fmt(v, col.metric) } } },
        plugins: { tooltip: { callbacks: {
          label: (ctx) => { const g = yearRows[ctx.dataIndex][1]; return [`${g.count} episode${g.count > 1 ? "s" : ""}`, `${fmt(g.total, col.metric)} ${name}`, `${fmt(g.total / g.count, col.metric)} per episode`]; },
        } } },
      },
    });

    // Cumulative share held by the top episodes: a steep curve means a few hits carry the archive.
    let run = 0;
    const shares = sorted.map((v) => (run += v) / (total || 1));
    const curvePoints = [{ x: 0, y: 0 }, ...shares.map((s, i) => ({ x: ((i + 1) / sorted.length) * 100, y: s * 100 }))];
    curve.note.textContent = "dashed line = every episode equal";
    curve.canvas.setAttribute("aria-label", `Top ${k} of ${sorted.length} episodes hold ${Math.round((shares[k - 1] || 0) * 100)}% of ${col.label}`);
    const cc = upsertChart(curve.canvas, {
      type: "scatter",
      data: { datasets: [
        { data: curvePoints, showLine: true, borderColor: colour, backgroundColor: alpha(colour, 0.1), fill: "origin", borderWidth: 2, pointRadius: 0, pointHoverRadius: 3 },
        { data: [{ x: 0, y: 0 }, { x: 100, y: 100 }], showLine: true, borderColor: COLORS.rule2, borderDash: [3, 4], borderWidth: 1, pointRadius: 0, pointHoverRadius: 0 },
        { data: k ? [curvePoints[k]] : [], pointRadius: 4, pointBackgroundColor: COLORS.ink, pointHoverRadius: 5 },
      ] },
      options: {
        interaction: { mode: "nearest", intersect: false, axis: "x" },
        scales: {
          x: { min: 0, max: 100, grid: { display: false }, ticks: { stepSize: 50, callback: (v) => (v === 50 ? "50% of episodes" : `${v}%`) } },
          y: { min: 0, max: 100, border: { display: false }, grid: { color: COLORS.rule }, ticks: { stepSize: 50, callback: (v) => `${v}%` } },
        },
        plugins: { tooltip: { filter: (item) => item.datasetIndex === 0 && item.dataIndex > 0, callbacks: {
          title: (items) => `Top ${items[0].dataIndex} episodes`,
          label: (ctx) => [`${Math.round(ctx.raw.x)}% of the catalog`, `${Math.round(ctx.raw.y)}% of ${name}`],
        } } },
      },
    });
    cc.$overlay = { labels: k ? [{ x: curvePoints[k].x, y: curvePoints[k].y, text: `top ${k} → ${Math.round(shares[k - 1] * 100)}%`, dy: 14 }] : [] };
    cc.draw();
  }
  select.addEventListener("change", draw);
  draw();
}

/* ---------- sources ---------- */

function renderSources() {
  const list = document.getElementById("sources-list");
  if (!DATA.coverage.length) { list.append(el("li", { class: "empty" }, "No collector has run yet. Run: uv run python -m metrics.collect")); return; }
  const start = DATES[0], end = DATES[DATES.length - 1], n = DATES.length;
  const position = (d) => (d < start ? 0 : d > end ? n - 1 : DATES.indexOf(d));
  for (const s of DATA.coverage) {
    const li = tint(el("li"), s.source);
    const name = el("span", { class: "src-name" });
    name.append(sourceDot(s.source), PLATFORM_NAMES.has(s.source) ? el("a", { href: `#${s.source}` }, sourceName(s.source)) : el("span", {}, sourceName(s.source)));
    // Where in the report window this source holds data.
    const span = el("div", { class: "span-track", title: s.first_period ? `${s.first_period} – ${s.last_period}` : "no data" });
    if (s.first_period && n) {
      const fill = el("div", { class: "span-fill" });
      const a = position(s.first_period), b = Math.max(a, position(s.last_period));
      fill.style.left = `${(a / n) * 100}%`;
      fill.style.width = `${((b - a + 1) / n) * 100}%`;
      span.append(fill);
    }
    const detail = el("div", { class: "src-detail" });
    detail.append(el("span", {}, s.first_period ? `${shortDate(s.first_period)} – ${shortDate(s.last_period)}` : "no data yet"));
    if (s.last_run_at) detail.append(el("span", { class: "faint" }, ` · last run ${runTime(s.last_run_at)}`));
    if (s.last_run_message) detail.append(el("div", { class: "faint" }, s.last_run_message));
    li.append(name, el("span", { class: `status ${s.last_run_status || "none"}` }, s.last_run_status || "never run"), span, detail);
    list.append(li);
  }
}

/* ---------- platform tab ---------- */

// A titled section with a mount point, for the platform panel's tables.
function section(title, note) {
  const box = el("section"), head = el("div", { class: "section-head" }), mount = el("div");
  head.append(el("h2", {}, title), el("span", { class: "note" }, note || ""));
  box.append(head, mount);
  document.getElementById("platform-body").append(box);
  return { mount, note: head.lastChild };
}

function renderPlatform(source) {
  const p = DATA.platforms.find((x) => x.source === source) || { description: "" }, run = RUNS[source] || {};
  const head = tint(document.getElementById("phead"), source);
  head.replaceChildren();
  const h1 = el("h1");
  h1.append(sourceDot(source), el("span", {}, sourceName(source)));
  const runBox = el("div", { class: "p-run" });
  runBox.append(el("span", { class: `status ${run.last_run_status || "none"}` }, run.last_run_status || "never run"), el("br"),
    el("span", {}, run.last_run_at ? `last run ${runTime(run.last_run_at)}` : "never collected"),
    el("br"), el("span", {}, run.first_period ? `data ${shortDate(run.first_period)} – ${shortDate(run.last_period)}` : "no data yet"));
  head.append(h1, runBox, el("div", { class: "p-about" }, p.description));
  if (run.last_run_message) head.append(el("div", { class: "p-msg" }, run.last_run_message));

  const body = document.getElementById("platform-body");
  body.replaceChildren();
  activeTable = null;
  const columns = DATA.episodes.columns.filter((c) => c.source === source);
  const withData = columns.some((c) => DATA.episodes.rows.some((r) => has(r.values[c.key])));
  if (withData) {
    const s = section("Episodes");
    renderEpisodes(s.mount, columns, s.note, { onlyWithData: true });
  }
  for (const t of DATA.items.filter((x) => x.source === source && x.rows.length)) {
    const s = section(`${t.entity_type.charAt(0).toUpperCase()}${t.entity_type.slice(1)}s`, `${t.rows.length} tracked · latest readings, not affected by the range`);
    renderItemTable(s.mount, t);
  }
  if (!withData && !DATA.items.some((x) => x.source === source && x.rows.length)) {
    body.append(el("p", { class: "empty" }, `${sourceName(source)} has no per-episode numbers or tracked posts yet; its totals are above.`));
  }
}

/* ---------- tabs ---------- */

function renderChrome() {
  document.getElementById("title").textContent = DATA.show_title;
  const generated = runTime(DATA.generated_at);
  document.getElementById("meta").textContent = `Data through ${shortDate(DATA.today)} · generated ${generated} UTC`;

  // Tabs: Overview, then each platform in collector order. A tab is a link to its hash, so route() opens it.
  const tabs = document.getElementById("tabs");
  for (const id of ["overview", ...PLATFORM_NAMES]) {
    const overview = id === "overview", failing = RUNS[id]?.last_run_status === "failed";
    const tab = el("a", {
      href: `#${id}`, role: "tab", id: `tab-${id}`, "aria-controls": overview ? "panel-overview" : "panel-platform",
      "aria-selected": "false", tabindex: "-1", title: failing ? `${sourceName(id)}: the last collection failed` : null,
    });
    if (!overview) tint(tab, id).append(el("span", { class: `dot${failing ? " failing" : ""}`, "aria-hidden": "true" }));
    tab.append(el("span", {}, overview ? "Overview" : sourceName(id)));
    tabs.append(tab);
  }
  // Arrow keys, Home, and End move between tabs and open the one reached (the WAI-ARIA tabs pattern).
  tabs.addEventListener("keydown", (ev) => {
    const list = [...tabs.querySelectorAll('[role="tab"]')], at = list.indexOf(document.activeElement);
    const next = { ArrowRight: at + 1, ArrowLeft: at - 1, Home: 0, End: list.length - 1 }[ev.key];
    if (at === -1 || next === undefined) return;
    ev.preventDefault();
    const target = list[(next + list.length) % list.length];
    target.focus();
    location.hash = target.getAttribute("href");
  });

  // One glance at collector health; the link jumps to the details on the overview.
  const health = document.getElementById("health");
  const failing = DATA.coverage.filter((s) => s.last_run_status === "failed").length, total = DATA.coverage.length;
  health.classList.toggle("bad", failing > 0 || !total);
  health.append(el("span", { class: "dot", "aria-hidden": "true" }),
    el("span", {}, !total ? "no sources yet" : failing ? `${failing}/${total} sources failing` : `${total} sources ok`));
}

let overviewTable = null;
function showTab(tab) {
  const changed = tab !== state.tab, overview = tab === "overview";
  state.tab = tab;
  document.querySelectorAll('#tabs [role="tab"]').forEach((a) => {
    const on = a.id === `tab-${tab}`;
    a.setAttribute("aria-selected", String(on));
    a.tabIndex = on ? 0 : -1;
  });
  document.getElementById("panel-overview").hidden = !overview;
  const panel = document.getElementById("panel-platform");
  panel.hidden = overview;
  if (overview) {
    activeTable = overviewTable;
  } else {
    panel.setAttribute("aria-labelledby", `tab-${tab}`);
    renderPlatform(tab);
  }
  // The one chart row moves into the open tab.
  document.getElementById(overview ? "slot-overview" : "slot-platform").append(document.getElementById("chart-row"));
  // A platform tab opens on one of its own series; the overview keeps whatever was being looked at.
  if (!overview && CHARTS.get(state.key)?.source !== tab) state.key = defaultKey(tab);
  document.title = overview ? `${DATA.show_title} · Listening report` : `${sourceName(tab)} · ${DATA.show_title}`;
  renderPicker();
  refresh();
  if (changed) window.scrollTo(0, 0);
}

// "#youtube" opens that platform; any other hash is a section on the overview (e.g. #sources from the health badge).
function route() {
  const id = decodeURIComponent(location.hash.slice(1));
  const tab = PLATFORM_NAMES.has(id) ? id : "overview";
  showTab(tab);
  const target = tab === "overview" && id && id !== "overview" ? document.getElementById(id) : null;
  if (target) requestAnimationFrame(() => target.scrollIntoView());
}

/* ---------- start ---------- */

// Charts draw on canvas, which can't re-flow text, so they wait for the embedded font.
document.fonts.ready.then(() => {
  renderChrome();
  renderRange();
  buildPlatformCards();
  wireTimeline();
  wireCompare();
  renderEpisodes(document.getElementById("episodes"), DATA.episodes.columns.filter((c) => c.headline), document.getElementById("episodes-note"));
  overviewTable = activeTable;
  renderCatalog();
  renderSources();
  window.addEventListener("hashchange", route);
  window.addEventListener("beforeprint", () => Object.values(Chart.instances).forEach((c) => c.resize()));
  route();
});
</script>
